[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-local-llm-hybrid-framework"
version = "0.0.1"
description = "From-scratch local LLM, RAG, and Agentic AI hybrid framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sudhish Singh" }
]
keywords = [
  "local-llm",
  "rag",
  "retrieval-augmented-generation",
  "agentic-ai",
  "llm",
  "ai-infrastructure",
  "from-scratch",
  "hybrid-framework"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["alhf*"]
